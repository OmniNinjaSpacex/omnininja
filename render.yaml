services:
  - type: web
    name: omninininja-ai
    runtime: node
    plan: free
    renderSubdomainPolicy: enabled
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npx prisma db push --skip-generate && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BROWSERLESS_API_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: OMNINJA_MODEL
        value: gpt-5.1
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OMNININJA_SANDBOX_PROVIDER
        value: ailab
      - key: AILAB_BASE_URL
        sync: false
      - key: AILAB_API_TOKEN
        sync: false
      - key: AILAB_PROVISION_TIMEOUT_MS
        value: '300000'
      - key: OMNININJA_AILAB_WORKSPACE
        value: .omnininja-workspace
      - key: OMNININJA_SANDBOX_ALLOW_NETWORK
        value: 'false'

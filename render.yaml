services:
  - type: web
    name: omnininja-ai
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npx prisma db push --skip-generate && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: OMNINJA_MODEL
        value: gpt-5.1
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OMNININJA_WORKSPACE_ROOT
        value: /tmp/omnininja/workspaces
      - key: OMNININJA_SANDBOX_BASE
        value: /tmp/omnininja/sandboxes
      - key: OMNININJA_SANDBOX_IMAGE
        value: /tmp/omnininja/sandbox-base
      - key: OMNININJA_SANDBOX_ALLOW_NETWORK
        value: 'false'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnininja
      POSTGRES_USER: omnininja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnininja -d omnininja"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  omnininja:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://omnininja:${POSTGRES_PASSWORD}@postgres:5432/omnininja?schema=public
      NODE_ENV: production
      OMNININJA_SANDBOX_PROVIDER: ${OMNININJA_SANDBOX_PROVIDER:-disabled}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: builder
    command: npm run db:migrate:deploy
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://omnininja:${POSTGRES_PASSWORD}@postgres:5432/omnininja?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:

name: Deploy OmniNinja to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Netlify token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || (echo "NETLIFY_AUTH_TOKEN is missing" >&2; exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create or reuse OmniNinja Netlify project
        id: site
        shell: bash
        run: |
          set -euo pipefail

          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-')"
          PREFIX="omninininja-${OWNER}"
          API="https://api.netlify.com/api/v1"
          AUTH_HEADER="Authorization: Bearer ${NETLIFY_AUTH_TOKEN}"

          echo "Looking for an existing Netlify project beginning with: $PREFIX"
          SITES_JSON="$(curl --fail --show-error --silent -H "$AUTH_HEADER" "$API/sites")"
          SITE_ID="$(printf '%s' "$SITES_JSON" | SITE_PREFIX="$PREFIX" node -e '
            let raw = "";
            process.stdin.on("data", d => raw += d).on("end", () => {
              const items = JSON.parse(raw || "[]");
              const prefix = process.env.SITE_PREFIX || "";
              const found = Array.isArray(items) ? items.find(x => String(x.name || "").startsWith(prefix)) : null;
              process.stdout.write(found ? String(found.id || "") : "");
            });
          ')"

          if [ -z "$SITE_ID" ]; then
            SUFFIX="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
            SITE_NAME="${PREFIX}-${SUFFIX}"
            echo "No existing project found. Creating through Netlify REST API: $SITE_NAME"
            CREATE_JSON="$(SITE_NAME="$SITE_NAME" node -e 'process.stdout.write(JSON.stringify({name: process.env.SITE_NAME}))' | curl --fail --show-error --silent -X POST -H "$AUTH_HEADER" -H 'Content-Type: application/json' --data-binary @- "$API/sites")"
            SITE_ID="$(printf '%s' "$CREATE_JSON" | node -e '
              let raw = "";
              process.stdin.on("data", d => raw += d).on("end", () => {
                const x = JSON.parse(raw || "{}");
                process.stdout.write(String(x.id || ""));
              });
            ')"
          fi

          test -n "$SITE_ID" || (echo "Could not determine Netlify Project ID" >&2; exit 1)
          echo "Netlify project ready: $SITE_ID"
          echo "NETLIFY_SITE_ID=$SITE_ID" >> "$GITHUB_ENV"
          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"

      - name: Link project
        run: npx netlify-cli@latest link --id "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"

      - name: Configure non-secret OmniNinja runtime settings
        shell: bash
        run: |
          set -euo pipefail
          npx netlify-cli@latest env:set OMNINJA_MODEL gpt-5.1 --context production --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --force
          npx netlify-cli@latest env:set OPENAI_BASE_URL https://api.openai.com/v1 --context production --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --force

      - name: Copy optional app secrets to Netlify
        shell: bash
        run: |
          set -euo pipefail
          set_secret () {
            key="$1"
            value="$2"
            if [ -n "$value" ]; then
              npx netlify-cli@latest env:set "$key" "$value" --context production --secret --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --force >/dev/null
              echo "$key configured"
            else
              echo "$key not present in GitHub Secrets; skipping"
            fi
          }
          set_secret OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          set_secret BROWSERLESS_API_KEY "${BROWSERLESS_API_KEY:-}"
          set_secret DATABASE_URL "${DATABASE_URL:-}"
          set_secret NEXTAUTH_SECRET "${NEXTAUTH_SECRET:-}"

      - name: Build with Netlify
        run: npx netlify-cli@latest build --context production --auth "$NETLIFY_AUTH_TOKEN"

      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          npx netlify-cli@latest deploy --prod --auth "$NETLIFY_AUTH_TOKEN" --json | tee /tmp/netlify-deploy.json

      - name: Print public deployment URL
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/netlify-deploy.json', 'utf8');
          const start = raw.indexOf('{');
          if (start < 0) {
            console.log(raw);
            process.exit(0);
          }
          const data = JSON.parse(raw.slice(start));
          console.log('Public URL:', data.url || data.deploy_url || data.site_url || 'see Netlify deploy output');
          NODE

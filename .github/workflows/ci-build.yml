name: OmniNinja build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      DATABASE_URL: 'file:./prisma/ci.db'
      NEXTAUTH_SECRET: 'ci-only-placeholder-not-for-production'
      OPENAI_API_KEY: 'ci-only-placeholder-not-for-production'
      OMNINJA_MODEL: 'gpt-5.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

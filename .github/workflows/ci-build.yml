name: OmniNinja build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omnininja_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnininja_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: '1'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/omnininja_ci?schema=public'
      NEXTAUTH_SECRET: 'ci-only-placeholder-not-for-production'
      OPENAI_API_KEY: 'ci-only-placeholder-not-for-production'
      OMNINJA_MODEL: 'gpt-5.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate PostgreSQL schema
        run: npx prisma db push --skip-generate

      - name: Build Next.js
        run: npm run build

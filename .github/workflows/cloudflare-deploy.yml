name: Deploy OmniNinja to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      AILAB_BASE_URL: ${{ secrets.AILAB_BASE_URL }}
      AILAB_API_TOKEN: ${{ secrets.AILAB_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL OPENAI_API_KEY NEXTAUTH_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is not configured in GitHub Actions secrets"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate database schema
        run: npx prisma db push --skip-generate

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Bootstrap Worker
        run: npx wrangler deploy

      - name: Sync runtime secrets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = ['DATABASE_URL','OPENAI_API_KEY','NEXTAUTH_SECRET'];
          const optional = ['BROWSERLESS_API_KEY','AILAB_BASE_URL','AILAB_API_TOKEN'];
          const out = {};
          for (const key of [...required, ...optional]) {
            const value = process.env[key];
            if (value) out[key] = value;
          }
          fs.writeFileSync('/tmp/omnininja-secrets.json', JSON.stringify(out));
          NODE
          npx wrangler secret bulk /tmp/omnininja-secrets.json
          rm -f /tmp/omnininja-secrets.json

      - name: Final deploy
        run: npx wrangler deploy

      - name: Smoke test custom domain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 5 https://scriptsrimuru.online/api/health
